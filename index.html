<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聖經研讀 (V15)</title>

    <link rel="apple-touch-icon" sizes="180x180" href="bible-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="bible-icon.png">
    <link rel="icon" type="image/png" href="bible-icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #8e44ad;
            --bg: #f0f2f5; 
            --text: #333;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: 1px solid rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --glass-blur: blur(12px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
            padding-bottom: 120px;
            -webkit-text-size-adjust: 100%;
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; }
        
        /* 通用玻璃卡片樣式 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }

        /* 頂部控制卡片 */
        .main-control-card { text-align: center; }

        h1 { margin: 0; color: var(--primary); font-size: 1.6rem; font-weight: 700; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

        /* 載入狀態 */
        .loading-container { text-align: center; margin: 10px 0 20px 0; }
        .progress-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        /* 控制面板網格 */
        .controls-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            text-align: left;
            opacity: 0.5; pointer-events: none; transition: opacity 0.3s;
        }
        .controls-grid.active { opacity: 1; pointer-events: all; }
        
        .full-width { grid-column: 1 / -1; width: 100%; }
        .verse-group { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; width: 100%; }
        .verse-select { flex: 1; }
        
        /* 輸入控件玻璃化 */
        select, .read-btn, .nav-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 12px; font-size: 16px; color: var(--text);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
            width: 100%; box-sizing: border-box;
        }
        select:focus { outline: none; box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.2); }

        /* 導航列 */
        .nav-row { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 5px; }
        
        .read-btn {
            flex-grow: 2; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white; border: none;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
        }
        .read-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(44, 62, 80, 0.4); }

        .nav-btn {
            flex-grow: 0; min-width: 60px; font-size: 20px; font-weight: bold; cursor: pointer;
            background: rgba(255, 255, 255, 0.9); color: var(--primary);
            width: auto;
        }
        .nav-btn:hover { background: white; }

        /* 經文卡片 */
        .scripture-card { display: none; border-top: 4px solid var(--accent); }

        /* 功能按鈕區 */
        .action-area { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        
        .glass-btn {
            padding: 14px; border-radius: 16px; border: none;
            color: white; font-weight: 600; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1), inset 0 2px 3px rgba(255,255,255,0.2);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .glass-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 0 2px 3px rgba(255,255,255,0.3); }
        .glass-btn:active { transform: translateY(-1px); }

        .ai-btn { background: linear-gradient(135deg, #f1c40f88 0%, #f39c12cc 100%); }
        .grok-btn { background: linear-gradient(135deg, #34495e88 0%, #2c3e50cc 100%); }
        .copy-btn { background: linear-gradient(135deg, #9b59b688 0%, #8e44adcc 100%); }

        /* 經文內容 */
        .ref-title { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .scripture-text { font-size: 1.2rem; line-height: 1.9; color: var(--text); white-space: pre-wrap; }
        .verse-num { color: var(--accent); font-weight: bold; font-size: 0.8em; margin-right: 4px; opacity: 0.7; }

        /* Gemini 區塊 */
        .gemini-section {
            display: none; margin-top: 30px;
            background: rgba(248, 250, 252, 0.8);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .gemini-header { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f39c12; }
        .gemini-content { font-size: 1.05rem; line-height: 1.8; color: #444; }
        .gemini-content h1, .gemini-content h2 { color: var(--primary); margin-top: 20px; }
        .gemini-content strong { color: #c0392b; background: none; padding: 0; }

        .ai-loading { text-align: center; padding: 20px; font-style: italic; color: #666; display: none; }
        .ai-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.1); border-top: 3px solid #f39c12; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-note { text-align: right; font-size: 0.75rem; color: #999; margin-top: 30px; font-style: italic; }

        @media (max-width: 600px) { 
            .controls-grid { grid-template-columns: 1fr; } 
            .action-area { grid-template-columns: 1fr; }
            .glass-btn { font-size: 1rem; padding: 12px; white-space: normal; }
            .glass-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card main-control-card">
        <h1>📖 聖經研讀</h1>
        <div class="subtitle">資料來源：和合本繁體</div>

        <div id="loadingArea" class="loading-container">
            <div id="loadingText" style="color:#666; font-size: 0.9rem;">正在下載資料庫 (4.5MB)...</div>
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        </div>

        <div id="controlGrid" class="controls-grid">
            <select id="bookSelect" class="full-width" onchange="updateChapters()"><option>載入中...</option></select>
            <select id="chapterSelect" class="full-width" onchange="updateStartVerses()"><option>-</option></select>
            
            <div class="verse-group">
                <select id="startVerseSelect" class="verse-select" onchange="updateEndVerses()"><option>-</option></select>
                <span id="toLabel" style="display:none; color:#999;">至</span>
                <select id="endVerseSelect" class="verse-select" style="display:none;"><option>-</option></select>
            </div>

            <div class="nav-row">
                <button class="nav-btn" onclick="prevChapter()" title="上一章">❮</button>
                <button class="read-btn" onclick="displayScripture()">閱讀經文</button>
                <button class="nav-btn" onclick="nextChapter()" title="下一章">❯</button>
            </div>
        </div>
    </div>

    <div id="resultCard" class="glass-card scripture-card">
        
        <div id="actionArea" class="action-area">
            <button class="glass-btn ai-btn" onclick="callGeminiAPI()">✨ Gemini 解經(VPN/非香港用戶)</button>
            <button class="glass-btn grok-btn" onclick="openGrok()">🚀 前往 Grok</button>
            <button class="glass-btn copy-btn" id="copyBtn" onclick="copyPrompt()">📋 複製指令</button>
        </div>

        <div class="ref-title" id="displayRef"></div>
        <div class="scripture-text" id="displayText"></div>

        <div id="geminiSection" class="glass-card gemini-section">
            <div class="gemini-header">
                <span>🤖 Gemini 2.0 Flash 解讀</span>
            </div>
            <div id="aiLoading" class="ai-loading">
                <div class="ai-spinner"></div> 正在連線 Google Gemini 思考神學意涵...
            </div>
            <div id="geminiResult" class="gemini-content"></div>
        </div>

        <div class="footer-note" id="footerVer">Powered by Google Gemini AI解釋內容只供參考</div>
    </div>
</div>

<textarea id="hiddenPrompt" style="display:none;"></textarea>

<script>
    // --- API 設定 ---
    const GEMINI_KEY = "AIzaSyBURyCnTRY5pO0OZjyMRI37jYEU_tWShhg";
    const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`;

    const BIBLE_URL = 'https://cokcok1.github.io/bible-ai/chinese_union_trad_trad.txt';
    let bibleData = {};
    let bookOrder = [];

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('footerVer').innerText = `Powered by Google Gemini AI解釋內容只供參考 ${today} (V15-CleanPrompt)`;

    window.onload = async function() {
        try {
            const response = await fetch(BIBLE_URL);
            if (!response.ok) throw new Error("網絡下載失敗");
            const reader = response.body.getReader();
            const contentLength = +response.headers.get('Content-Length');
            let receivedLength = 0;
            let chunks = [];
            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                chunks.push(value);
                receivedLength += value.length;
                if (contentLength) document.getElementById('progressFill').style.width = (receivedLength / contentLength * 100) + "%";
            }
            document.getElementById('loadingText').innerText = "解析結構中...";
            let text = new TextDecoder("utf-8").decode(concatUint8Arrays(chunks));
            parseBibleText(text);
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('controlGrid').className += ' active';
            initSelectors();
        } catch (e) {
            document.getElementById('loadingText').innerText = "錯誤：" + e.message;
        }
    };

    function concatUint8Arrays(arrays) {
        let totalLength = arrays.reduce((acc, val) => acc + val.length, 0);
        let result = new Uint8Array(totalLength);
        let len = 0;
        for (let arr of arrays) { result.set(arr, len); len += arr.length; }
        return result;
    }

    function parseBibleText(rawText) {
        const lines = rawText.split('\n');
        const lineRegex = /^(.+?)\s+(\d+):(\d+)\s+(.*)$/;
        lines.forEach(line => {
            line = line.trim();
            if (!line) return;
            const match = line.match(lineRegex);
            if (match) {
                const book = match[1];
                const chapter = parseInt(match[2]);
                const verse = parseInt(match[3]);
                const content = match[4];
                if (!bibleData[book]) { bibleData[book] = {}; bookOrder.push(book); }
                if (!bibleData[book][chapter]) { bibleData[book][chapter] = {}; }
                bibleData[book][chapter][verse] = content;
            }
        });
    }

    const bookSel = document.getElementById('bookSelect');
    const chapSel = document.getElementById('chapterSelect');
    const startVerSel = document.getElementById('startVerseSelect');
    const endVerSel = document.getElementById('endVerseSelect');

    function initSelectors() {
        bookSel.innerHTML = "";
        bookOrder.forEach(bk => {
            let op = document.createElement('option');
            op.value = bk; op.text = bk; bookSel.add(op);
        });
        updateChapters();
    }

    function updateChapters() {
        const book = bookSel.value;
        chapSel.innerHTML = "";
        const chaps = Object.keys(bibleData[book]).map(Number).sort((a,b)=>a-b);
        chaps.forEach(ch => {
            let op = document.createElement('option');
            op.value = ch; op.text = `第 ${ch} 章`; chapSel.add(op);
        });
        updateStartVerses();
    }

    function updateStartVerses() {
        const book = bookSel.value;
        const chap = chapSel.value;
        startVerSel.innerHTML = '<option value="all">整章 (Whole Chapter)</option>';
        if (bibleData[book] && bibleData[book][chap]) {
            const verses = Object.keys(bibleData[book][chap]).map(Number).sort((a,b)=>a-b);
            verses.forEach(v => {
                let op = document.createElement('option');
                op.value = v; op.text = `第 ${v} 節`; startVerSel.add(op);
            });
        }
        updateEndVerses();
    }

    function updateEndVerses() {
        const startVal = startVerSel.value;
        if (startVal === "all") {
            document.getElementById('toLabel').style.display = "none";
            endVerSel.style.display = "none";
            return;
        }
        document.getElementById('toLabel').style.display = "block";
        endVerSel.style.display = "block";
        endVerSel.innerHTML = "";
        const book = bookSel.value;
        const chap = chapSel.value;
        const startNum = parseInt(startVal);
        if (bibleData[book] && bibleData[book][chap]) {
            const verses = Object.keys(bibleData[book][chap]).map(Number).sort((a,b)=>a-b);
            verses.forEach(v => {
                if (v >= startNum) {
                    let op = document.createElement('option');
                    op.value = v; op.text = `第 ${v} 節`; endVerSel.add(op);
                }
            });
        }
    }

    function nextChapter() {
        const currentBook = bookSel.value;
        const currentChap = parseInt(chapSel.value);
        if (bibleData[currentBook][currentChap + 1]) {
            chapSel.value = currentChap + 1;
        } else {
            const bookIdx = bookOrder.indexOf(currentBook);
            if (bookIdx < bookOrder.length - 1) {
                const nextBook = bookOrder[bookIdx + 1];
                bookSel.value = nextBook;
                updateChapters();
                chapSel.value = 1;
            } else {
                alert("已經是最後一章了");
                return;
            }
        }
        updateStartVerses(); displayScripture();
    }

    function prevChapter() {
        const currentBook = bookSel.value;
        const currentChap = parseInt(chapSel.value);
        if (currentChap > 1) {
            chapSel.value = currentChap - 1;
        } else {
            const bookIdx = bookOrder.indexOf(currentBook);
            if (bookIdx > 0) {
                const prevBook = bookOrder[bookIdx - 1];
                bookSel.value = prevBook;
                updateChapters();
                const chaps = Object.keys(bibleData[prevBook]).map(Number);
                chapSel.value = Math.max(...chaps);
            } else {
                alert("已經是第一章了");
                return;
            }
        }
        updateStartVerses(); displayScripture();
    }

    function displayScripture() {
        document.getElementById('geminiSection').style.display = 'none';
        document.getElementById('geminiResult').innerHTML = '';
        
        const book = bookSel.value;
        const chap = chapSel.value;
        const startVer = startVerSel.value;
        let displayText = "";
        let refText = "";
        let promptText = "";

        if (startVer === "all") {
            refText = `${book} 第 ${chap} 章`;
            const verses = bibleData[book][chap];
            Object.keys(verses).map(Number).sort((a,b)=>a-b).forEach(v => {
                displayText += `<span class='verse-num'>[${v}]</span>${verses[v]}\n`;
                promptText += `${v}. ${verses[v]}\n`;
            });
        } else {
            const startNum = parseInt(startVer);
            const endNum = parseInt(endVerSel.value);
            if (startNum === endNum) {
                 refText = `${book} 第 ${chap} 章 第 ${startNum} 節`;
            } else {
                 refText = `${book} 第 ${chap} 章 ${startNum}-${endNum} 節`;
            }
            for (let i = startNum; i <= endNum; i++) {
                if (bibleData[book][chap][i]) {
                    displayText += `<span class='verse-num'>[${i}]</span>${bibleData[book][chap][i]}\n`;
                    promptText += `${i}. ${bibleData[book][chap][i]}\n`;
                }
            }
        }

        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('displayRef').innerText = refText;
        document.getElementById('displayText').innerHTML = displayText;
        document.getElementById('actionArea').style.display = 'grid';

        // V15: 呼叫生成時，不再傳入經文文字
        generateHiddenPrompt(refText, ""); 
    }

    // V15: 已更新的生成邏輯，不再包含經文內容
    function generateHiddenPrompt(ref, text) {
        const prompt = `請用中文（繁體）並以基督教信仰和聖經真理為基礎，解釋聖經【${ref}】。

請提供：
- 【經文概要】概述此章內容與主要事件。
- 【經文解釋】詳細闡述該節的含義。
- 【神學重點】指出核心神學信息、救恩啟示及屬靈信息。
- 【歷史文化背景】補充與理解本章相關的背景資料。
- 【引用】列出其他聖經相關經文，並說明其關聯。
- 【屬靈應用】提供如何將此章的信息應用於信徒生活。
- 【默想與反思問題】提出2-3個引導思考與靈修的問題。`;
        document.getElementById('hiddenPrompt').value = prompt;
    }

    // --- Gemini API ---
    async function callGeminiAPI() {
        const prompt = document.getElementById('hiddenPrompt').value;
        if(!prompt) { alert("請先閱讀經文"); return; }
        const section = document.getElementById('geminiSection');
        const loading = document.getElementById('aiLoading');
        const result = document.getElementById('geminiResult');
        
        section.style.display = 'block';
        loading.style.display = 'block';
        result.innerHTML = '';
        section.scrollIntoView({ behavior: 'smooth' });

        try {
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            const response = await fetch(GEMINI_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            const data = await response.json();
            const rawMarkdown = data.candidates[0].content.parts[0].text;
            result.innerHTML = parseMarkdown(rawMarkdown);
        } catch (error) {
            result.innerHTML = `<span style="color:red;">錯誤：無法連接 Gemini API (${error.message})</span>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    function parseMarkdown(text) {
        let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
        html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
        html = html.replace(/^\- (.*$)/gim, '<li>$1</li>');
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    function openGrok() {
        const txt = document.getElementById('hiddenPrompt').value;
        if (!txt) { alert("請先選擇經文"); return; }
        fallbackCopy(txt, () => {
            alert("✅ 指令已複製！\n即將打開 Grok，請在對話框按「貼上」(Ctrl+V) 即可。");
            window.open('https://grok.com', '_blank');
        });
    }

    function copyPrompt() {
        const txt = document.getElementById('hiddenPrompt').value;
        if (!txt) return;
        const onSuccess = () => {
            const btn = document.getElementById('copyBtn');
            const originalText = "📋 複製指令";
            btn.innerText = "✅ 成功";
            btn.style.background = "linear-gradient(135deg, #27ae6088 0%, #2ecc71cc 100%)";
            setTimeout(() => { 
                btn.innerText = originalText; 
                btn.style.background = ""; 
            }, 2000);
        };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(txt).then(onSuccess).catch(() => fallbackCopy(txt, onSuccess));
        } else {
            fallbackCopy(txt, onSuccess);
        }
    }

    function fallbackCopy(text, callback) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "absolute";
        textArea.style.left = "-9999px";
        textArea.setAttribute("readonly", "");
        document.body.appendChild(textArea);
        if (navigator.userAgent.match(/ipad|ipod|iphone/i)) {
            const range = document.createRange();
            range.selectNodeContents(textArea);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            textArea.setSelectionRange(0, 999999);
        } else {
            textArea.select();
        }
        try { if (document.execCommand('copy')) callback(); else alert("複製失敗，請手動長按選擇"); } 
        catch (err) { alert("瀏覽器不支援複製"); }
        document.body.removeChild(textArea);
    }
</script>

</body>
</html>
